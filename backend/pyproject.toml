[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ask-my-docs-backend"
version = "0.1.0"
description = "Ask My Docs - Production RAG Backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0,<1.0.0",
    "uvicorn[standard]>=0.30.0,<1.0.0",
    "pydantic>=2.9.0,<3.0.0",
    "pydantic[email]>=2.9.0,<3.0.0",
    "pydantic-settings>=2.5.0,<3.0.0",
    "motor>=3.6.0,<4.0.0",
    "pymongo>=4.10.0,<5.0.0",
    "qdrant-client>=1.11.0,<2.0.0",
    "httpx>=0.27.0,<1.0.0",
    "passlib[argon2]>=1.7.4,<2.0.0",
    "python-jose[cryptography]>=3.3.0,<4.0.0",
    "python-multipart>=0.0.9",
    "PyMuPDF>=1.24.0,<2.0.0",
    "python-docx>=1.1.0,<2.0.0",
    "markdown>=3.6,<4.0",
    "rank-bm25>=0.2.2",
    "google-genai>=1.0.0,<3.0.0",
    "google-auth>=2.30.0,<3.0.0",
    "sentence-transformers>=3.0.0,<4.0.0",
    "openai>=1.50.0,<2.0.0",  # NVIDIA NIM (OpenAI-compatible)
    "groq>=0.13.0,<1.0.0",  # Legacy fallback
    "razorpay>=1.4.2",  # Payment processing
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0,<9.0.0",
    "pytest-asyncio>=0.24.0,<1.0.0",
    "httpx>=0.27.0,<1.0.0",
    "ruff>=0.6.0,<1.0.0",
    "mongomock-motor>=0.0.34",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
